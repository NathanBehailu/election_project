<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Election Portal - Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <section class="portal-hero">
        <p class="campaign-badge">Election Portal</p>
        <h1>Cast Your Vote</h1>
        <p class="hero-subtext">Secure student voting with one ballot per voter.</p>
      </section>

      <div class="card login-card">
        <div class="ballot-mark">Ballot Ready</div>
        <label for="nameInput">Full Name</label>
        <input
          id="nameInput"
          placeholder="Enter your full name"
          required
          maxlength="100"
          autocomplete="name"
          pattern="[A-Za-z]+([ '-][A-Za-z]+)*"
          title="Letters, spaces, hyphens, and apostrophes only"
        />

        <label for="idInput">ID Number</label>
        <input
          id="idInput"
          placeholder="Enter your ID number"
          required
          maxlength="20"
          inputmode="numeric"
          pattern="[0-9]+"
          title="Digits only"
        />

        <button id="loginButton">Enter Election Portal</button>
        <p id="message"></p>
        <p>
          Don't have an account yet?
          <a href="signup.html">Create one here</a>.
        </p>
      </div>
    </div>

    <script src="script.js"></script>
    <script>
      const nameInput = document.getElementById("nameInput");
      const idInput = document.getElementById("idInput");
      const loginButton = document.getElementById("loginButton");
      const message = document.getElementById("message");

      loginButton.addEventListener("click", async () => {
        message.className = "";
        message.textContent = "";
        const nameResult = validateFullName(nameInput.value);
        if (!nameResult.ok) {
          message.className = "error";
          message.textContent = nameResult.message;
          return;
        }

        const idResult = validateIdNumber(idInput.value);
        if (!idResult.ok) {
          message.className = "error";
          message.textContent = idResult.message;
          return;
        }

        const name = nameResult.value;
        const id_number = idResult.value;

        try {
          loginButton.disabled = true;
          const data = await api.loginUser({ name, id_number });
          saveCurrentUser(data.user);
          if (data.user.has_voted) {
            message.className = "success";
            message.textContent = "You already voted. Sending you to results...";
            setTimeout(() => (window.location.href = "results.html"), 900);
            return;
          }
          window.location.href = "vote.html";
        } catch (error) {
          message.className = "error";
          message.textContent = error.message;
        } finally {
          loginButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
